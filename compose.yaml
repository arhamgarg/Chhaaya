services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chhaaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chhaaya
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chhaaya"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chhaaya@db:5432/chhaaya
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chhaaya@db:5432/chhaaya
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health')"]
      interval: 2s
      retries: 15
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "-m", "chhaaya.worker"]
    # A database error outside a message stops the process; start it again.
    restart: unless-stopped
    volumes:
      - ./data/intent/model:/app/data/intent/model:ro
    env_file: .env
    environment:
      DATABASE_URL: postgresql://chhaaya@db:5432/chhaaya
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional: `docker compose --profile tunnel up` exposes the app to Meta.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  pgdata:
