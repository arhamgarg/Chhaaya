# Danger signs (design section 6). Every sign cites the page it comes from;
# page numbers are the ones printed on the page.
#
# MCP Card 2018: Mother and Child Protection Card, MoHFW and MoWCD, 2018.
#   https://nhm.gov.in/New-Update-2022-24/CH-Programmes/HBNC-&-HBYC-Resource-%20Material/Revised-India-MCP-Card-English-(28-05-2018).pdf
# IMNCI Chart Booklet: Facility Based IMNCI Chart Booklet, MoHFW with WHO and UNICEF.
#   https://nhm.gov.in/images/pdf/programmes/child-health/guidelines/imnci_chart_booklet.pdf
# ASHA Module 6: Skills that Save Lives, Focus on Maternal and Newborn Health, NRHM.
#   https://nhm.gov.in/images/pdf/communitisation/asha/book-no-6.pdf
# Phrasings are matched after normalisation (case, Unicode, common Hinglish
# spelling variants), in order, with up to six other words between
# neighbouring words; "aa/aaya" accepts either form. See
# src/chhaaya/danger_signs.py.

urgent_reply:
  en: >-
    This could be serious. Please go to the nearest health centre now, or call
    108 for a free ambulance. We have also told your ASHA.
  hi: >-
    यह गंभीर हो सकता है। कृपया अभी नज़दीकी स्वास्थ्य केंद्र जाएँ, या मुफ़्त
    एम्बुलेंस के लिए 108 पर कॉल करें। हमने आपकी आशा दीदी को भी बता दिया है।
  hi-Latn: >-
    Yeh gambhir ho sakta hai. Kripya abhi nazdeeki swasthya kendra jaayein, ya
    muft ambulance ke liye 108 par call karein. Humne aapki ASHA didi ko bhi
    bata diya hai.

