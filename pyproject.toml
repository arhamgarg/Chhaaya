[project]
name = "chhaaya"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.3",
    "tokenizers>=0.23.3",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "testcontainers>=4.15.0",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chhaaya"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The retrieval check needs the BGE-M3 model and a built corpus: `pytest -m retrieval`.
# The lexicon check downloads NLEM 2022 and CDCI: `pytest -m lexicon`.
addopts = "-m 'not retrieval and not lexicon'"
markers = [
    "retrieval: embeds data/chunks.jsonl with the real BGE-M3 model",
    "lexicon: builds data/lexicon.csv from the downloaded NLEM 2022 and CDCI",
]

# CPU-only PyTorch on Linux (CI and the Docker image); PyPI's default Linux wheel
# pulls in CUDA libraries the embedder never uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
